map $http_authorization $proxy_api_authorization {
    ""                                        "__PROXY_DEFAULT_BEARER__";
    "Bearer dev-owner-bearer-token-change-me" "__PROXY_DEFAULT_BEARER__";
    default                                   $http_authorization;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/lan.crt;
    ssl_certificate_key /etc/nginx/certs/lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $proxy_api_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /health/ {
        proxy_pass http://api-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
