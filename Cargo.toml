[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/domain",
    "crates/framework",
    "crates/features",
    "crates/api",
    "bins/api-server",
    "bins/discord-worker",
    "bins/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
common = { path = "crates/common", version = "0.1.0" }
domain = { path = "crates/domain", version = "0.1.0" }
framework = { path = "crates/framework", version = "0.1.0" }
features = { path = "crates/features", version = "0.1.0" }
api = { path = "crates/api", version = "0.1.0" }

async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
base64 = "0.22"
bytes = "1.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hound = "3.5"
http-body-util = "0.1"
ogg = "0.9"
opus = "0.4"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["copy-dylibs", "download-binaries", "ndarray", "std", "tls-rustls"] }
poise = "0.7"
proptest = "1.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rubato = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "chrono", "client", "gateway", "http", "model", "rustls_backend", "utils"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "isomp4", "mp3", "ogg", "pcm", "wav"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.11", features = ["serde", "v4", "v7"] }
whisper-rs = { version = "0.16", default-features = false, features = ["tracing_backend"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
