[advisories]
version = 2
ignore = [
    # Transitive via sqlx 0.8 and serenity 0.12; no upstream chrono replacement in sqlx 0.8 / serenity 0.12.
    { id = "RUSTSEC-2026-0543", reason = "chrono transitive dependency of sqlx and serenity" },
    # Transitive via serenity 0.12 -> tokio-tungstenite 0.21 -> rustls 0.22 / rustls-webpki 0.102 (Discord gateway WSS only).
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 transitive via serenity 0.12" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 transitive via serenity 0.12" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 transitive via serenity 0.12" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 transitive via serenity 0.12" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 transitive via serenity 0.12" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.22 transitive via serenity 0.12" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.22 transitive via serenity 0.12" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
